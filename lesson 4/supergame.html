<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iframe in HTML</title>
    </head>
    <body>

        <center>

            <h1>Super Game zone</h1>

            <h2>Play the challange inside the webpage!</h2>

            <p>Jump, move, dodge and try to complete the game with out openning a new tab.</p>


            <iframe
               src="https://scratch.mit.edu/projects/60917032/embed"
               allowtranparency="true"
               width="500"
               height="400"
               frameborder="0"
               scrolling="no"
               allowfullscreen>
            </iframe>

            <h2>The game is live!</h2>

            <p>
                The webpage uses iframe to show an exciting Scratch game inside HTML.
            </p>
        </center>
    </body>
</html>
